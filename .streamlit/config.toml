[server]
# Listen on this computer only: ledgers are financial data, so the app is not
# offered to the rest of the network. Delete this line to host it for others.
address = "localhost"
enableStaticServing = true
maxUploadSize = 5

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#155645"
backgroundColor = "#F5F6F3"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#14231E"
borderColor = "#DCE4DF"
linkColor = "#155645"
font = "'Instrument Sans', Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
headingFont = "'Instrument Sans', Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
baseRadius = "8px"
# Decision badges in the review queue (text on background, all above 4.5:1 contrast).
orangeBackgroundColor = "#FBE9C0"
orangeTextColor = "#6B4300"
greenBackgroundColor = "#E1EEE7"
greenTextColor = "#155645"
blueBackgroundColor = "#E2E9F5"
blueTextColor = "#27406B"

[[theme.fontFaces]]
family = "Instrument Sans"
url = "app/static/fonts/InstrumentSans-latin-wght.woff2"
weight = "400 700"
style = "normal"
